# Build image from committed Dockerfile and push to Docker Hub (rynomarree).
# Add secret: DOCKERHUB_TOKEN (Docker Hub Access Token) in repo Settings → Secrets and variables → Actions.

name: Build and push to Docker Hub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: rynomarree
  IMAGE_NAME: filestash-authenticate-proxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
